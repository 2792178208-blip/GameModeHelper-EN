name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Self test
        run: ./selftest.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: GameModeHelper-app
          path: GameModeHelper.app
